<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Avatar Job Discussion AI - Login</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <style>
        @font-face {
            font-family: "Fira Sans Condensed";
            src: url("fonts/FiraSansCondensed-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: "Fira Sans Condensed";
            src: url("fonts/FiraSansCondensed-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }
        :root {
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #6b7280;
            --primary: #4f46e5;
            --primary-600: #4338ca;
            --accent: #22c55e;
            --accent-600: #16a34a;
            --ring: rgba(79, 70, 229, 0.15);
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Fira Sans Condensed", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 20% 0%, rgba(79, 70, 229, 0.08), transparent 60%),
                radial-gradient(1000px 500px at 100% 100%, rgba(17, 94, 89, 0.06), transparent 60%),
                linear-gradient(180deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--surface);
            border-radius: 16px;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.04),
                0 8px 24px rgba(15, 23, 42, 0.24);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            display: flex;
            border: 1px solid var(--border);
            transform: translateY(0);
            transition: transform 300ms ease, box-shadow 300ms ease;
        }
        .container:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.04),
                0 24px 48px rgba(15, 23, 42, 0.28);
        }

        .left-panel {
            flex: 1;
            background: #f8fafc;
            padding: 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .illustration {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: radial-gradient(ellipse at center, #e5e7eb 0%, #eef2f7 60%, #f8fafc 100%);
            display: grid;
            place-items: center;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 8px 24px rgba(2,6,23,0.08);
        }
        .illustration .orbit {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #60a5fa;
            border-radius: 50%;
        }
        .illustration .orbit.o1 { top: 18%; left: 18%; }
        .illustration .orbit.o2 { bottom: 20%; right: 22%; background: #22c55e; }
        .illustration .orbit.o3 { top: 10%; right: 30%; background: #38bdf8; }
        .illustration svg {
            width: 140px;
            height: 140px;
            opacity: 0.9;
        }

        .right-panel {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-left: 1px solid var(--border);
        }

        h2 {
            color: var(--text);
            margin-bottom: 30px;
            font-size: 2rem;
            text-align: center;
        }

        .subhead {
            text-align: center;
            color: var(--muted);
            margin-top: -18px;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--muted);
            font-weight: 500;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px 14px 46px;
            border: 1.5px solid var(--border);
            border-radius: 9999px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8fafc;
            color: var(--text);
        }
        .input-field {
            position: relative;
        }
        .input-icon {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: var(--muted);
            opacity: 0.9;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: #ffffff;
            box-shadow: 0 0 0 6px var(--ring);
        }

        .btn {
            width: 100%;
            padding: 14px 16px;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-600) 100%);
            color: white;
            margin-bottom: 15px;
            border-radius: 9999px;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 12px 24px rgba(79, 70, 229, 0.28);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-secondary:hover {
            background: var(--primary);
            color: white;
        }

        .toggle-form {
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
        }

        .toggle-form a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .toggle-form a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: var(--error);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            animation: shake 0.5s;
        }

        .success-message {
            background: var(--success);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-10px);
            }

            75% {
                transform: translateX(10px);
            }
        }

        .registration-form {
            display: none;
        }

        .login-form {
            display: block;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                max-width: 400px;
            }

            .left-panel {
                padding: 30px;
            }

            .right-panel {
                padding: 30px;
            }

            .logo {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.5rem;
            }
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
        .form-row {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 12px;
            margin: 10px 0 18px;
        }
        .checkbox {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            cursor: pointer;
            user-select: none;
        }
        .checkbox input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }
        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
        .link:hover {
            text-decoration: underline;
        }
        .muted {
            color: var(--muted);
            font-size: 0.95rem;
            text-align: center;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <div class="illustration" aria-hidden="true">
                <span class="orbit o1"></span>
                <span class="orbit o2"></span>
                <span class="orbit o3"></span>
                <svg viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="16" y="28" width="96" height="64" rx="8" fill="#cbd5e1"/>
                    <rect x="24" y="36" width="80" height="48" rx="4" fill="#e5e7eb"/>
                    <circle cx="64" cy="60" r="16" stroke="#64748b" stroke-width="4"/>
                    <path d="M48 84c0-8.8 7.2-16 16-16s16 7.2 16 16" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
                    <rect x="40" y="94" width="48" height="6" rx="3" fill="#cbd5e1"/>
                </svg>
            </div>
        </div>

        <div class="right-panel">
            <div class="login-form">
                <h2>Sign in to SPATIAL MEET</h2>
                <div class="error-message" id="loginError" role="alert" aria-live="assertive"></div>
                <div class="success-message" id="loginSuccess" role="status" aria-live="polite"></div>

                <form id="loginForm">
                    <div class="form-group input-field">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M2 6.5A2.5 2.5 0 0 1 4.5 4h15A2.5 2.5 0 0 1 22 6.5V7l-10 6L2 7v-.5Z"/>
                            <path d="M2 8.5 12 14l10-5.5V17a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V8.5Z"/>
                        </svg>
                        <label for="loginUsername">Username or Email</label>
                        <input type="text" id="loginUsername" name="username" required>
                    </div>

                    <div class="form-group input-field">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 1a6 6 0 0 0-6 6v3H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a6 6 0 0 0-6-6Zm-4 9V7a4 4 0 1 1 8 0v3H8Z"/>
                        </svg>
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" name="password" required>
                    </div>

                    <div class="form-row">
                        <label class="checkbox" for="rememberMe">
                            <input type="checkbox" id="rememberMe" name="remember">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">LOGIN</button>
                </form>

                <div class="toggle-form">
                    Create your Account → <a href="#" onclick="toggleForms()">Register</a>
                </div>
            </div>

            <div class="registration-form">
                <h2>Create Account</h2>
                <p class="subhead">It's quick and easy</p>
                <div class="error-message" id="registerError" role="alert" aria-live="assertive"></div>
                <div class="success-message" id="registerSuccess" role="status" aria-live="polite"></div>

                <form id="registerForm">
                    <div class="form-group">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" required>
                    </div>

                    <div class="form-group">
                        <label for="studentId">Student ID (Optional)</label>
                        <input type="text" id="studentId" name="studentId">
                    </div>

                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6">
                    </div>

                    <button type="submit" class="btn btn-primary">Create Account</button>
                </form>

                <div class="toggle-form">
                    Already have an account? <a href="#" onclick="toggleForms()">Sign in here</a>
                </div>
                <p class="muted">By creating an account you agree to the Terms and Privacy Policy</p>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Please wait...</p>
            </div>
        </div>
    </div>

    <script>
        function toggleForms() {
            const loginForm = document.querySelector('.login-form');
            const registerForm = document.querySelector('.registration-form');

            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
            }

            // Clear messages
            hideAllMessages();
        }

        function showError(form, message) {
            const errorDiv = form === 'login' ?
                document.getElementById('loginError') :
                document.getElementById('registerError');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        function showSuccess(form, message) {
            const successDiv = form === 'login' ?
                document.getElementById('loginSuccess') :
                document.getElementById('registerSuccess');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
        }

        function hideAllMessages() {
            document.querySelectorAll('.error-message, .success-message').forEach(msg => {
                msg.style.display = 'none';
            });
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAllMessages();
            showLoading(true);

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                console.log('🔍 Response status:', response.status);
                const result = await response.json();
                console.log('🔍 Response data:', result);

                if (result.success) {
                    showSuccess('login', 'Login successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = '/landing.html';
                    }, 1500);
                } else {
                    showError('login', result.message || 'Login failed');
                }
            } catch (error) {
                console.error('🔍 Login error:', error);
                showError('login', 'Network error. Please try again.');
            } finally {
                showLoading(false);
            }
        });

        // Registration form submission
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideAllMessages();
            showLoading(true);

            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);

            // Validate passwords match
            if (data.password !== data.confirmPassword) {
                showError('register', 'Passwords do not match');
                showLoading(false);
                return;
            }

            // Remove confirmPassword from data
            delete data.confirmPassword;

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    showSuccess('register', 'Registration successful! Please login...');
                    setTimeout(() => {
                        toggleForms();
                    }, 2000);
                } else {
                    showError('register', result.message || 'Registration failed');
                }
            } catch (error) {
                showError('register', 'Network error. Please try again.');
            } finally {
                showLoading(false);
            }
        });

        // Check if user is already logged in
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/check-auth');
                const result = await response.json();

                if (result.authenticated) {
                    window.location.href = '/landing.html';
                }
            } catch (error) {
                // User not authenticated, stay on login page
            }
        });
    </script>
</body>

</html>
