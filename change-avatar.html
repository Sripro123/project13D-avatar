<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Avatar - SPATIAL MEET</title>
    <link rel="icon" type="image/jpg" href="favicon.jpg">
    <style>
        @font-face {
            font-family: "Fira Sans Condensed";
            src: url("fonts/FiraSansCondensed-Regular.ttf") format("truetype");
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        @font-face {
            font-family: "Fira Sans Condensed";
            src: url("fonts/FiraSansCondensed-Bold.ttf") format("truetype");
            font-weight: 700;
            font-style: normal;
            font-display: swap;
        }

        :root {
            --bg-start: #0f172a;
            --bg-end: #1e293b;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #6b7280;
            --primary: #4f46e5;
            --primary-600: #4338ca;
            --accent: #22c55e;
            --accent-600: #16a34a;
            --ring: rgba(79, 70, 229, 0.15);
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
            --heading-start: #f472b6;
            --heading-end: #a78bfa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Fira Sans Condensed", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background:
                radial-gradient(1200px 600px at 20% 0%, rgba(79, 70, 229, 0.08), transparent 60%),
                radial-gradient(1000px 500px at 100% 100%, rgba(17, 94, 89, 0.06), transparent 60%),
                linear-gradient(180deg, var(--bg-start), var(--bg-end));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: var(--surface);
            border-radius: 16px;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.04),
                0 8px 24px rgba(15, 23, 42, 0.24);
            overflow: hidden;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            display: flex;
            border: 1px solid var(--border);
            transform: translateY(0);
            transition: transform 300ms ease, box-shadow 300ms ease;
        }

        .container:hover {
            transform: translateY(-2px);
            box-shadow:
                0 8px 16px rgba(0, 0, 0, 0.04),
                0 24px 48px rgba(15, 23, 42, 0.28);
        }

        .left-panel {
            flex: 1.1;
            background: #f8fafc;
            padding: 30px;
            display: flex;
            flex-direction: column;
            border-right: 1px solid var(--border);
        }

        .preview-frame {
            flex: 1;
            border-radius: 16px;
            border: 1.5px solid var(--border);
            background: #ffffff;
            display: grid;
            place-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.02);
            min-height: 400px;
            margin-bottom: 20px;
        }

        .preview-placeholder {
            text-align: center;
            color: var(--muted);
            font-weight: 500;
        }

        .preview-ring {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px dashed #cbd5e1;
            margin: 0 auto 12px;
            background: #f1f5f9;
        }

        .left-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .right-panel {
            flex: 0.9;
            padding: 40px;
            display: flex;
            flex-direction: column;
        }

        h2 {
            margin-bottom: 8px;
            font-size: 2.2rem;
            text-align: left;
            background: linear-gradient(90deg, var(--heading-start), var(--heading-end));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subhead {
            text-align: left;
            color: var(--muted);
            margin-bottom: 30px;
            font-size: 1rem;
        }

        .section {
            margin-bottom: 30px;
        }

        .section h3 {
            font-size: 1.1rem;
            color: var(--text);
            margin-bottom: 12px;
            font-weight: 600;
        }

        .file-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 8px;
        }

        .file-name {
            color: var(--muted);
            font-size: 0.85rem;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border);
            word-break: break-all;
        }

        .muted {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .divider {
            height: 1px;
            background: var(--border);
            margin: 24px 0;
        }

        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--heading-start) 0%, var(--heading-end) 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(244, 114, 182, 0.25);
        }

        .btn-secondary {
            background: #ffffff;
            color: var(--text);
            border: 1.5px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .btn-accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-600) 100%);
            color: white;
        }

        .btn-accent:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(34, 197, 94, 0.25);
        }

        .form-actions {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 20px;
            margin-top: auto;
        }

        .form-actions a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
        }

        .form-actions a:hover {
            text-decoration: underline;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.open {
            display: flex;
            opacity: 1;
        }

        /* Ready Player Me Iframe */
        #rpmIframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 12px;
            display: none;
        }

        #rpmIframe.open {
            display: block;
        }

        .modal {
            width: min(500px, 92vw);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
            transform: scale(0.95) translateY(10px);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-overlay.open .modal {
            transform: scale(1) translateY(0);
        }

        .modal h4 {
            color: var(--text);
            font-size: 1.4rem;
            margin-bottom: 24px;
            text-align: center;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .modal-footer {
            display: flex;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .left-panel {
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .modal-actions {
                grid-template-columns: 1fr;
            }

            .left-actions {
                flex-direction: column;
            }

            .left-actions .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Left Panel for Preview -->
        <div class="left-panel">
            <div class="preview-frame">
                <div class="preview-placeholder">
                    <div class="preview-ring"></div>
                    <div>Avatar preview area</div>
                </div>
            </div>
            <div class="left-actions">
                <button class="btn btn-primary" type="button" id="saveAvatarBtn">Save Avatar</button>
            </div>
        </div>

        <!-- Right Panel for Actions -->
        <div class="right-panel">
            <h2>Change Avatar</h2>
            <p class="subhead">Update your 3D avatar model</p>

            <div class="section">
                <h3>Upload Custom GLB</h3>
                <div class="file-row">
                    <input type="file" id="glbInput" accept=".glb" hidden>
                    <button class="btn btn-secondary" type="button" id="glbUploadBtn">Upload .glb</button>
                    <span class="file-name" id="glbFileName">No file selected</span>
                </div>
                <p class="muted">Uploads your model and previews it.</p>
            </div>

            <div class="divider"></div>

            <div class="section">
                <h3>Create Avatar</h3>
                <button class="btn btn-accent" type="button" id="openCustomize">Select &amp; Customize</button>
                <p class="muted" style="margin-top: 8px;">Create a custom avatar or pick a preset.</p>
            </div>

            <div class="form-actions">
                <a href="/edit-profile.html">Cancel / Back to Profile</a>
            </div>
        </div>
    </div>

    <!-- Customize Modal -->
    <div class="modal-overlay" id="customizeOverlay" aria-hidden="true">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" id="selectionModal">
            <h4 id="modalTitle">Select or Customize</h4>
            <div class="modal-actions">
                <button class="btn btn-secondary" type="button" data-choice="male">Male </button>
                <button class="btn btn-secondary" type="button" data-choice="female">Female </button>
                <button class="btn btn-secondary" type="button" data-choice="customize">Customize</button>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" type="button" id="closeCustomize"
                    style="width: auto; padding: 10px 24px;">Cancel</button>
            </div>
        </div>
        
        <div class="modal" id="rpmModal" style="display: none; width: min(800px, 95vw); height: 700px;">
            <h4 style="margin-bottom: 10px;">Create Your Avatar</h4>
            <iframe id="rpmIframe" src="" allow="camera; microphone; clipboard-write"></iframe>
            <div class="modal-footer" style="margin-top: 15px;">
                <button class="btn btn-secondary" type="button" id="closeRPM" style="width: auto; padding: 10px 24px;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        const glbInput = document.getElementById('glbInput');
        const glbUploadBtn = document.getElementById('glbUploadBtn');
        const glbFileName = document.getElementById('glbFileName');
        const customizeOverlay = document.getElementById('customizeOverlay');
        const openCustomize = document.getElementById('openCustomize');
        const closeCustomize = document.getElementById('closeCustomize');
        const selectionModal = document.getElementById('selectionModal');
        const rpmModal = document.getElementById('rpmModal');
        const rpmIframe = document.getElementById('rpmIframe');
        const closeRPM = document.getElementById('closeRPM');

        let currentUser = null;

        // Load user info
        async function loadUser() {
            try {
                const response = await fetch('/api/user-info');
                const result = await response.json();
                if (result.success) {
                    currentUser = result.user;
                }
            } catch (error) {
                console.error('Error fetching user info:', error);
            }
        }
        loadUser();

        glbUploadBtn.addEventListener('click', () => glbInput.click());
        glbInput.addEventListener('change', () => {
            const file = glbInput.files[0];
            glbFileName.textContent = file ? file.name : 'No file selected';
        });

        const openModal = () => {
            customizeOverlay.classList.add('open');
            customizeOverlay.setAttribute('aria-hidden', 'false');
            selectionModal.style.display = 'block';
            rpmModal.style.display = 'none';
        };
        const closeModal = () => {
            customizeOverlay.classList.remove('open');
            customizeOverlay.setAttribute('aria-hidden', 'true');
            rpmIframe.src = ""; // Stop the iframe
        };

        openCustomize.addEventListener('click', openModal);
        closeCustomize.addEventListener('click', closeModal);
        closeRPM.addEventListener('click', closeModal);

        customizeOverlay.addEventListener('click', (event) => {
            if (event.target === customizeOverlay) {
                closeModal();
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && customizeOverlay.classList.contains('open')) {
                closeModal();
            }
        });

        async function saveAvatarPreference(avatarUrl) {
            if (!currentUser) {
                alert("Please log in first.");
                return;
            }

            try {
                const data = {
                    full_name: currentUser.full_name,
                    username: currentUser.username,
                    email: currentUser.email,
                    avatar_url: avatarUrl
                };

                const response = await fetch('/api/update-profile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (result.success) {
                    // Update sessionStorage as well
                    if (currentUser) {
                        currentUser.avatar_url = avatarUrl;
                        sessionStorage.setItem('user', JSON.stringify(currentUser));
                    }
                    sessionStorage.setItem('userAvatarUrl', avatarUrl);
                    
                    alert('Avatar saved successfully!');
                    window.location.href = '/landing.html';
                } else {
                    alert('Failed to save avatar: ' + result.message);
                }
            } catch (error) {
                console.error('Error saving avatar:', error);
                alert('An error occurred while saving.');
            }
        }

        document.querySelectorAll('[data-choice]').forEach((button) => {
            button.addEventListener('click', () => {
                const choice = button.getAttribute('data-choice');
                if (choice === 'male') {
                    saveAvatarPreference('avatar.glb');
                    closeModal();
                } else if (choice === 'female') {
                    saveAvatarPreference('mpfb.glb');
                    closeModal();
                } else if (choice === 'customize') {
                    // Show RPM Iframe
                    selectionModal.style.display = 'none';
                    rpmModal.style.display = 'block';
                    rpmIframe.style.display = 'block';
                    // Use RPM subdomain or demo
                    const subdomain = 'demo'; 
                    rpmIframe.src = `https://${subdomain}.readyplayer.me/avatar?frameApi`;
                }
            });
        });

        // Listen for RPM message
        window.addEventListener('message', async (event) => {
            const url = event.data;

            if (typeof url !== 'string' || !url.includes('.glb')) {
                return;
            }

            console.log('Avatar GLB URL received:', url);
            
            // Add quality/morph target params as recommended in README
            const params = "?morphTargets=ARKit,Oculus+Visemes,mouthOpen,mouthSmile,eyesClosed,eyesLookUp,eyesLookDown&textureSizeLimit=1024&textureFormat=png";
            const finalUrl = url + params;
            
            await saveAvatarPreference(finalUrl);
            closeModal();
        });

        document.getElementById('saveAvatarBtn').addEventListener('click', () => {
            // If they uploaded a GLB, this button should probably handle it.
            // But for now, just a placeholder.
            alert('Avatar saving enabled through "Pick & Customize" presets.');
        });
    </script>
</body>

</html>
